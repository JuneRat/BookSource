name: build

on:
  push:
    paths:
      - 'sources/**'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Merge sources
        run: |
          python3 - <<'EOF'
          import json, glob

          merged = []
          for f in sorted(glob.glob('sources/*.json')):
              data = json.load(open(f, encoding='utf-8'))
              if isinstance(data, list):
                  merged += data
              else:
                  merged.append(data)

          with open('booksource.json', 'w', encoding='utf-8') as fp:
              json.dump(merged, fp, ensure_ascii=False, indent=2)

          print(f'合并 {len(glob.glob("sources/*.json"))} 个文件 -> {len(merged)} 个书源')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booksource.json
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "build: 自动合并 sources/ -> booksource.json"
          git push
